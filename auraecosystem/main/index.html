<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- https://github.com/auraecosystem/main -->

    <title>Preact Demo</title>

    <script type="importmap">
    {
      "imports": {
        "preact": "https://unpkg.com/preact@10.25.4/dist/preact.module.js",
        "preact/hooks": "https://unpkg.com/preact@10.25.4/hooks/dist/hooks.module.js",
        "htm": "https://unpkg.com/htm@3.1.1/dist/htm.module.js"
      }
    }
    </script>
</head>

<body>

<script type="module">
import { h, render } from "preact";
import { useState } from "preact/hooks";
import htm from "htm";

const html = htm.bind(h);

function App() {
    const [count, setCount] = useState(0);

    return html`
        <main>
            <h1>Preact + HTM</h1>

            <p>Count: ${count}</p>

            <button onClick=${() => setCount(count + 1)}>
                Increment
            </button>
        </main>
    `;
}

render(html`<${App} />`, document.body);
</script>

</body>
</html>
