name: Universal CI/CD Pipeline (with properties.json Support)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # 1. READ CONFIG, VERIFY, BUILD & ARTIFACT GENERATION
  # -------------------------------------------------------------
  build-and-verify:
    runs-on: ubuntu-latest
    outputs:
      dist_dir: ${{ steps.config.outputs.dist_dir }}
      project_name: ${{ steps.config.outputs.project_name }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      # Read and Validate properties.json Configuration
      - name: Parse properties.json Metadata
        id: config
        run: |
          if [ -f "properties.json" ]; then
            echo "Found properties.json file. Validating syntax..."
            jq '.' properties.json || (echo "Invalid JSON syntax in properties.json" && exit 1)

            # Extract fields with fallbacks if key does not exist
            DIST_DIR=$(jq -r '.buildDir // .outputDir // empty' properties.json)
            PROJECT_NAME=$(jq -r '.name // .projectName // empty' properties.json)
          fi

          # Fallback output directory resolution if not set in properties.json
          if [ -z "$DIST_DIR" ]; then
            if [ -d "dist" ]; then DIST_DIR="dist";
            elif [ -d "build" ]; then DIST_DIR="build";
            elif [ -d "out" ]; then DIST_DIR="out";
            else DIST_DIR="."; fi
          fi

          echo "Target distribution directory: $DIST_DIR"
          echo "dist_dir=$DIST_DIR" >> $GITHUB_OUTPUT
          echo "project_name=$PROJECT_NAME" >> $GITHUB_OUTPUT

      # Dependency Installation
      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f yarn.lock ]; then
            yarn --frozen-lockfile
          elif [ -f pnpm-lock.yaml ]; then
            corepack enable && pnpm install --frozen-lockfile
          elif [ -f package.json ]; then
            npm install
          fi

      - name: Run Linter (if configured)
        run: npm run lint --if-present

      - name: Run Unit Tests (if configured)
        run: npm test --if-present

      - name: Build Production Output
        run: npm run build --if-present

      # Localhost HTTP Server Verification Check
      - name: Verify Web Asset Bundle on Localhost
        run: |
          TARGET_DIR="${{ steps.config.outputs.dist_dir }}"
          npx serve -s "$TARGET_DIR" -l 4173 &
          sleep 3
          curl -f http://localhost:4173 || exit 1

      # Package Artifact for GitHub Pages
      - name: Package Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.config.outputs.dist_dir }}

      # Package Generic Artifact for Cloud/Web4 Deployments
      - name: Package Generic Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-production-build
          path: ${{ steps.config.outputs.dist_dir }}
          retention-days: 7

  # -------------------------------------------------------------
  # 2. DEPLOY TO GITHUB PAGES
  # -------------------------------------------------------------
  deploy-github-pages:
    needs: build-and-verify
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # -------------------------------------------------------------
  # 3. DEPLOY TO CLOUD (Vercel / Cloudflare)
  # -------------------------------------------------------------
  deploy-cloud:
    needs: build-and-verify
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push' && secrets.VERCEL_TOKEN != ''
    environment:
      name: cloud-production
    runs-on: ubuntu-latest

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: app-production-build
          path: ./${{ needs.build-and-verify.outputs.dist_dir }}

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel Cloud
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --token=$VERCEL_TOKEN --prod

  # -------------------------------------------------------------
  # 4. DEPLOY TO WEB4 / DECENTRALIZED IPFS
  # -------------------------------------------------------------
  deploy-web4:
    needs: build-and-verify
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push' && secrets.PINATA_API_KEY != ''
    environment:
      name: web4-ipfs
    runs-on: ubuntu-latest

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: app-production-build
          path: ./${{ needs.build-and-verify.outputs.dist_dir }}

      - name: Deploy to Decentralized IPFS Gateway
        uses: ipshipyard/ipfs-deploy-action@v2
        with:
          path-to-deploy: ./${{ needs.build-and-verify.outputs.dist_dir }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pinata-api-key: ${{ secrets.PINATA_API_KEY }}
          pinata-secret-api-key: ${{ secrets.PINATA_SECRET_API_KEY }}
