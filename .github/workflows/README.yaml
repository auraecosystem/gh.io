name: Update README, patch, rebase, merge with recent blog posts

on:
  schedule:
    - cron: '0 */12 * * *'  # Run every 12 hours
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show repository files (debug)
        run: |
          echo "Working directory:"
          pwd
          echo "Top-level files:"
          ls -la
          echo "Check for update_readme.py and scripts/ directory:"
          ls -la update_readme.py || true
          ls -la scripts || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser certifi

      - name: Update README
        run: |
          python ./update_readme.py

      - name: Check for changes
        id: git-check
        run: |
          git status --porcelain
          git diff --quiet || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md profile/README.md || true
          git commit -m "Updated README with latest blog posts" || echo "Nothing to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No changes
        if: steps.git-check.outputs.changes != 'true'
        run: echo "No changes to commit"
